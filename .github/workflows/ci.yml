name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm exec prettier --check .

      - name: Typecheck infra
        working-directory: infra
        run: pnpm install --frozen-lockfile && pnpm typecheck

      # Local Supabase (Postgres + Auth) in Docker, with the migrations applied. Services the tests
      # don't use are skipped to start faster.
      - name: Start Supabase
        run: >-
          pnpm exec supabase start
          -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta

      - run: pnpm test

      - name: Build image
        run: docker build -t planner-backend:ci .
